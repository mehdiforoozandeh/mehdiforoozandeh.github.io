  <style>
    :root{
      --font-body:'Inter',system-ui,sans-serif;
      --font-display:'JetBrains Mono',ui-monospace,monospace;
    }
    /* ---------- LIGHT (Claude milk) ---------- */
    html[data-theme="light"]{
      --bg:#faf9f5;
      --bg-glow:#ffffff;
      --bg-edge:#f0eee6;
      --text:#2b2a26;
      --muted:#77746b;
      --panel:#fffdf8;
      --panel-2:#f4f2ea;
      --border:rgba(40,38,32,.10);
      --overlay:rgba(60,56,46,.32);
      --toggle-bg:#ffffff;
      --toggle-border:rgba(40,38,32,.12);
      --ring:rgba(40,38,32,.10);
      --branch:#adaba0;
      --shadow:0 24px 60px -24px rgba(70,62,45,.40);
      --shadow-sm:0 6px 18px -8px rgba(70,62,45,.30);
    }
    /* ---------- DARK (Obsidian) ---------- */
    html[data-theme="dark"]{
      --bg:#1e1e1e;
      --bg-glow:#262626;
      --bg-edge:#171717;
      --text:#dcddde;
      --muted:#8b8d91;
      --panel:#262626;
      --panel-2:#2f2f2f;
      --border:rgba(255,255,255,.09);
      --overlay:rgba(0,0,0,.58);
      --toggle-bg:#2a2a2a;
      --toggle-border:rgba(255,255,255,.12);
      --ring:rgba(255,255,255,.14);
      --branch:#7c7e82;
      --shadow:0 24px 60px -24px rgba(0,0,0,.75);
      --shadow-sm:0 6px 18px -8px rgba(0,0,0,.6);
    }

    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      font-family:var(--font-body);
      color:var(--text);
      background:
        radial-gradient(120% 120% at 50% 42%, var(--bg-glow) 0%, var(--bg) 46%, var(--bg-edge) 100%);
      overflow:hidden;
      -webkit-font-smoothing:antialiased;
      transition:background .5s ease,color .35s ease;
    }

    /* ---------- Stage ---------- */
    .stage{position:fixed;inset:0;overflow:hidden}
    .branches{position:absolute;inset:0;width:100%;height:100%;display:block}

    /* git-style lines + commit nodes: gray by default, green on hover; Blog is yellow */
    .gitline{fill:none;stroke:var(--branch);stroke-width:2.75;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s ease,stroke-width .2s ease,opacity .25s ease}
    .gitline.dim{opacity:.22}
    .gitline.hot{stroke:#7d9c66;stroke-width:3.75}
    .gitline.blog{stroke:#e2b13a}
    .gitline.blog.hot{stroke:#e2b13a}
    .node{opacity:0;transition:opacity .3s ease,transform .2s ease;transform-box:fill-box;transform-origin:center}
    .node.show{opacity:1}
    .node.dim{opacity:.3}
    .node.hot{transform:scale(1.4)}
    .node-core{fill:var(--branch);stroke:var(--bg);stroke-width:2.5px;transition:fill .2s ease}
    .node.hot .node-core{fill:#7d9c66}
    .node.blog .node-core{fill:#e2b13a}
    .node-halo{fill:#7d9c66;opacity:0;transition:opacity .2s ease}
    .node.blog .node-halo{fill:#e2b13a}
    .node.hot .node-halo{opacity:.22}

    /* ---------- Root (photo + name + socials) ---------- */
    .root{position:absolute;display:flex;flex-direction:column;align-items:center;z-index:6;opacity:0;animation:pop .7s cubic-bezier(.22,.9,.28,1.2) .05s forwards}
    .identity{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:center;opacity:0;animation:pop .7s cubic-bezier(.22,.9,.28,1.2) .18s forwards}
    @keyframes pop{from{opacity:0;transform:translateX(-50%) scale(.9)}to{opacity:1}}
    .photo{
      border-radius:50%;object-fit:cover;object-position:50% 30%;
      border:4px solid var(--panel);
      box-shadow:0 0 0 1px var(--ring), var(--shadow);
      background:var(--panel-2);user-select:none;-webkit-user-drag:none;
    }
    .photo-wrap{position:relative;border-radius:50%}
    .photo-wrap::after{content:'';position:absolute;inset:-14px;border-radius:50%;box-shadow:0 0 60px -10px rgba(120,150,190,.35);pointer-events:none}
    .name{font-family:var(--font-display);margin:16px 0 0;font-weight:500;letter-spacing:-.2px;white-space:nowrap;font-size:clamp(22px,2.9vw,31px);text-align:center;line-height:1.15}
    .tagline{font-family:var(--font-display);margin:7px 0 0;color:var(--muted);font-size:clamp(12px,1.35vw,15px);text-align:center;letter-spacing:0;white-space:nowrap}
    .socials-row{display:flex;gap:11px;margin-top:18px;justify-content:center}
    .socials-row a{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--border);box-shadow:var(--shadow-sm);color:#7d9c66;transition:transform .2s,border-color .2s}
    .socials-row a:hover{transform:translateY(-3px);border-color:#7d9c66}
    .socials-row svg{width:18px;height:18px;display:block}

    /* ---------- Node labels ---------- */
    .leaf{
      position:absolute;display:inline-flex;align-items:center;gap:8px;
      font-family:var(--font-display);font-size:clamp(14px,1.5vw,16px);letter-spacing:-.1px;color:var(--text);
      background:var(--panel);border:1px solid var(--border);
      padding:6px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;
      box-shadow:var(--shadow-sm);z-index:7;opacity:0;
      transition:opacity .4s ease,background .2s,border-color .2s,box-shadow .2s;
      -webkit-tap-highlight-color:transparent;
    }
    .leaf.show{opacity:1}
    .leaf.left{transform:translate(-100%,-50%);flex-direction:row-reverse}
    .leaf.right{transform:translate(0,-50%)}
    .leaf.top{transform:translate(-50%,-100%)}
    .leaf:hover,.leaf:focus-visible{background:var(--panel-2);box-shadow:var(--shadow);border-color:var(--leaf-color);outline:none}
    .leaf .dot{width:9px;height:9px;border-radius:50%;background:var(--leaf-color);flex:none}

    /* ---------- Theme toggle ---------- */
    .toggle{position:fixed;top:20px;right:20px;z-index:20;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--toggle-bg);border:1px solid var(--toggle-border);color:var(--text);box-shadow:var(--shadow-sm);transition:transform .3s cubic-bezier(.22,.9,.28,1.4),background .35s,border-color .35s}
    .toggle:hover{transform:rotate(18deg) scale(1.06)}
    .toggle svg{width:20px;height:20px}
    .toggle .moon{display:none}
    html[data-theme="dark"] .toggle .sun{display:none}
    html[data-theme="dark"] .toggle .moon{display:block}

    /* ---------- Overlay / panels ---------- */
    .overlay{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px}
    .overlay[hidden]{display:none}
    .scrim{position:absolute;inset:0;background:var(--overlay);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);animation:fade .28s ease}
    .sheet{position:relative;width:min(660px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:36px 34px 40px;animation:rise .32s cubic-bezier(.2,.85,.3,1)}
    .sheet::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--accent,#7d94ac);border-radius:22px 22px 0 0}
    .sheet-close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--panel-2);color:var(--muted);cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s,transform .2s}
    .sheet-close:hover{color:var(--text);transform:rotate(90deg)}
    @keyframes fade{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}

    /* ---------- Panel content ---------- */
    .p-eyebrow{display:flex;align-items:center;gap:9px;font-family:var(--font-display);color:var(--accent,#7d94ac);font-size:12.5px;font-weight:500;letter-spacing:1px;text-transform:uppercase;margin:0 0 8px}
    .p-eyebrow .dot{width:9px;height:9px;border-radius:50%;background:var(--accent,#7d94ac)}
    .p-title{font-family:var(--font-display);font-weight:500;font-size:29px;margin:0 0 4px}
    .p-lead{color:var(--muted);margin:0 0 22px;font-size:13px;line-height:1.65}
    .p-lead:last-child{margin-bottom:0}
    .timeline{display:flex;flex-direction:column;gap:18px}
    .t-item{padding-left:16px;border-left:2px solid var(--border);position:relative}
    .t-item::before{content:'';position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent,#7d94ac)}
    .t-item h4{margin:0;font-size:13.5px;font-weight:600}
    .t-item .org{margin:2px 0 0;font-size:12.5px;color:var(--text)}
    .t-item .date{margin:4px 0 0;font-family:var(--font-display);font-size:12.5px;color:var(--muted);letter-spacing:0}
    .pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
    .pill{font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--border);padding:5px 11px;border-radius:999px}
    .proj{padding:16px 0;border-top:1px solid var(--border)}
    .proj:first-of-type{border-top:none;padding-top:0}
    .proj-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .proj-head h4{margin:0;font-size:14.5px;font-weight:600}
    .proj p{margin:6px 0 8px;font-size:12.5px;line-height:1.55;color:var(--muted)}
    .proj a.gh{color:var(--muted);display:inline-flex;transition:color .2s;flex:none}
    .proj a.gh:hover{color:var(--accent)}
    .proj a.gh svg{width:18px;height:18px}
    .pub-year{font-family:var(--font-display);font-size:17px;font-weight:500;color:var(--accent,#7d94ac);margin:20px 0 10px;letter-spacing:0}
    .pub-year:first-child{margin-top:0}
    .pub{margin:0 0 14px}
    .pub .pt{margin:0;font-size:13px;font-weight:600;line-height:1.4}
    .pub .pa{margin:3px 0 0;font-size:11.5px;color:var(--muted);line-height:1.5}
    .pub .pj{margin:2px 0 0;font-size:11.5px;color:var(--text);font-style:italic}
    .blogcard{padding:18px 0;border-top:1px solid var(--border)}
    .blogcard:first-of-type{border-top:none;padding-top:0}
    .blogmeta{display:flex;gap:8px;font-family:var(--font-display);font-size:12.5px;color:var(--muted);margin-bottom:10px}
    .blogcard h4{margin:0 0 8px;font-size:15px;font-weight:600;line-height:1.35}
    .blogcard p{margin:0 0 10px;font-size:12.5px;line-height:1.6;color:var(--muted)}
    .contact-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--border)}
    .contact-row:first-of-type{border-top:none}
    .contact-row .ico{width:22px;height:22px;flex:none;color:#7d9c66;display:block}
    .contact-row .k{font-family:var(--font-display);font-size:12px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
    .contact-row .v{font-size:13px;margin-top:3px}
    .btn{display:inline-flex;align-items:center;gap:9px;margin-top:22px;background:var(--accent,#7d94ac);color:#fff;border:none;border-radius:12px;padding:10px 16px;font-family:var(--font-body);font-size:13px;font-weight:600;text-decoration:none;cursor:pointer;transition:transform .2s,filter .2s}
    .btn:hover{transform:translateY(-2px);filter:brightness(1.06)}
    .btn img{width:15px;height:15px;filter:brightness(0) invert(1)}
    .morelink{display:inline-block;margin-top:18px;color:var(--accent,#7d94ac);font-size:12.5px;font-weight:600;text-decoration:none}
    .morelink:hover{text-decoration:underline}
    a.read{color:var(--accent,#7d94ac);font-size:12.5px;font-weight:600;text-decoration:none}
    a.read:hover{text-decoration:underline}
    [dir="rtl"]{text-align:right}

    .hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-family:var(--font-display);color:var(--muted);font-size:12.5px;letter-spacing:0;z-index:6;opacity:0;animation:fadein 1s ease 1.2s forwards;pointer-events:none}
    @keyframes fadein{to{opacity:.7}}

    @media (max-width:640px){
      .leaf{font-size:11.5px;padding:4px 8px;letter-spacing:-.2px}
      .tagline{font-size:12px}
      .socials-row a{width:34px;height:34px}
      .socials-row svg{width:16px;height:16px}
    }
    @media (max-height:560px){
      .socials-row a{width:32px;height:32px;border-radius:9px}
      .socials-row svg{width:15px;height:15px}
      .socials-row{margin-top:12px}
      .name{margin-top:10px}
      .hint{display:none}
    }
    @media (max-width:520px){
      .sheet{padding:30px 22px 34px}
      .p-title{font-size:26px}
    }
  </style>
</head>

  </template>

  <script>
  (function(){
    const GH = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5A11.5 11.5 0 0 0 .5 12a11.5 11.5 0 0 0 7.86 10.92c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.53-1.34-1.3-1.7-1.3-1.7-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.73 1.27 3.4.97.1-.76.4-1.27.74-1.56-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.8 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.69 5.41-5.25 5.69.41.36.78 1.07.78 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5z"/></svg>';
    const SVGNS='http://www.w3.org/2000/svg';

    // Branches are gray by default and turn green on hover; Blog is always yellow.
    // side: left | right | top ; lane: 0 (top) .. 2 (bottom)
    const GREEN='#7d9c66', YELLOW='#e2b13a';
    const TOPICS = [
      { id:'education',    label:'Education',    side:'left',  lane:0 },
      { id:'about',        label:'About',        side:'left',  lane:1 },
      { id:'experience',   label:'Experience',   side:'left',  lane:2 },
      { id:'projects',     label:'Projects',     side:'right', lane:0 },
      { id:'publications', label:'Publications', side:'right', lane:1 },
      { id:'contact',      label:'Contact',      side:'right', lane:2 },
      { id:'blog',         label:'Blog',         side:'top', blog:true },
    ];
    const accentOf = tp => tp.blog ? YELLOW : GREEN;

    const stage = document.getElementById('stage');
    const svg   = document.getElementById('branches');
    const photo = document.getElementById('photo');
    const root  = document.getElementById('root');
    const identity = document.getElementById('identity');
    let leaves = [];

    // git-style connector: horizontal exit from the photo, a smooth swoop to
    // the target lane, then a straight run into the commit node
    function sidePath(sx, sy, nx, ny, left){
      const run = 34;
      const kx = left ? nx + run : nx - run;   // knee: where it goes straight
      const h  = Math.max(26, Math.abs(kx - sx) * 0.5);
      const c1x = left ? sx - h : sx + h;
      const c2x = left ? kx + h : kx - h;
      return 'M'+sx+','+sy+' C'+c1x+','+sy+' '+c2x+','+ny+' '+kx+','+ny+' L'+nx+','+ny;
    }

    function build(){
      const W = stage.clientWidth, H = stage.clientHeight;
      svg.setAttribute('viewBox','0 0 '+W+' '+H);
      svg.innerHTML=''; leaves.forEach(l=>l.remove()); leaves=[];

      const cx = W/2;
      const narrow = W < 640;      // portrait phone
      const short  = H < 560;      // landscape phone / short window
      const photoR = photo.getBoundingClientRect().width/2 || 70;
      const cy = Math.max(photoR + (short?84:118), H*(short?0.44:0.43));
      root.style.left='50%'; root.style.top=(cy-photoR)+'px'; root.style.transform='translateX(-50%)';

      const sideOffset = Math.max(narrow?20:30, Math.min(195, (cx - photoR) - 148));
      const nodeXL = cx - photoR - sideOffset;
      const nodeXR = cx + photoR + sideOffset;
      const laneGap = Math.min(photoR + 62, H*(short?0.15:0.185));
      const lanes = [cy - laneGap, cy, cy + laneGap];
      const blogY = Math.max(46, cy - photoR - Math.min(H*0.20, 150));

      // name + socials: below the photo on desktop; below the branch zone on phones,
      // bottom-anchored on short/landscape screens so nothing overflows
      identity.style.left='50%'; identity.style.transform='translateX(-50%)';
      if(narrow || short){
        const ih = identity.getBoundingClientRect().height || 130;
        identity.style.top = Math.min(cy + laneGap + (short?28:46), H - ih - 12) + 'px';
      } else {
        identity.style.top = (cy + photoR + 14) + 'px';
      }

      const items = [];
      TOPICS.forEach((tp,i)=>{
        let sx, sy, nx, ny, d;
        if(tp.side==='top'){
          sx=cx; sy=cy-photoR+2; nx=cx; ny=blogY;
          d='M'+sx+','+sy+' L'+nx+','+ny;
        } else {
          const left = tp.side==='left';
          sy=cy; sx = left ? cx-photoR+2 : cx+photoR-2;
          nx = left ? nodeXL : nodeXR; ny = lanes[tp.lane];
          d = sidePath(sx, sy, nx, ny, left);
        }

        // line (color comes from CSS: gray, green on hover, yellow for blog)
        const path=document.createElementNS(SVGNS,'path');
        path.setAttribute('class','gitline'+(tp.blog?' blog':'')); path.setAttribute('d',d);
        path.dataset.id=tp.id;
        svg.appendChild(path);
        const len=path.getTotalLength();
        const delay=140+i*80;
        path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
        requestAnimationFrame(()=>{
          path.style.transition='stroke-dashoffset .7s cubic-bezier(.4,.1,.2,1) '+delay+'ms, stroke-width .2s ease';
          path.style.strokeDashoffset='0';
        });

        // commit node (fill from CSS)
        const g=document.createElementNS(SVGNS,'g');
        g.setAttribute('class','node'+(tp.blog?' blog':'')); g.dataset.id=tp.id;
        const halo=document.createElementNS(SVGNS,'circle');
        halo.setAttribute('class','node-halo'); halo.setAttribute('cx',nx); halo.setAttribute('cy',ny); halo.setAttribute('r',12);
        const core=document.createElementNS(SVGNS,'circle');
        core.setAttribute('class','node-core'); core.setAttribute('cx',nx); core.setAttribute('cy',ny); core.setAttribute('r',5.5);
        g.appendChild(halo); g.appendChild(core); svg.appendChild(g);
        setTimeout(()=>g.classList.add('show'), delay+560);

        // label
        const leaf=document.createElement('button');
        leaf.className='leaf '+tp.side; leaf.dataset.id=tp.id;
        leaf.style.setProperty('--leaf-color',accentOf(tp));
        let lx=nx, ly=ny;
        if(tp.side==='left'){ lx=nx-12; }
        else if(tp.side==='right'){ lx=nx+12; }
        else { ly=ny-12; }
        leaf.style.left=lx+'px'; leaf.style.top=ly+'px';
        leaf.textContent=tp.label;
        stage.appendChild(leaf); leaves.push(leaf);
        setTimeout(()=>leaf.classList.add('show'), delay+560);

        items.push({path,g,leaf,id:tp.id});

        const enter=()=>{ items.forEach(o=>{ const on=o.id===tp.id; o.path.classList.toggle('hot',on); o.path.classList.toggle('dim',!on); o.g.classList.toggle('hot',on); o.g.classList.toggle('dim',!on); }); };
        const leave=()=>{ items.forEach(o=>{ o.path.classList.remove('hot','dim'); o.g.classList.remove('hot','dim'); }); };
        const openIt=()=>open(tp);
        leaf.addEventListener('mouseenter',enter); leaf.addEventListener('mouseleave',leave);
        g.addEventListener('mouseenter',enter); g.addEventListener('mouseleave',leave);
        path.addEventListener('mouseenter',enter); path.addEventListener('mouseleave',leave);
        leaf.addEventListener('click',openIt);
        g.style.cursor='pointer'; g.addEventListener('click',openIt);
        path.style.cursor='pointer'; path.addEventListener('click',openIt);
      });
    }

    // ---------- Overlay ----------
    const overlay=document.getElementById('overlay');
    const sheet=overlay.querySelector('.sheet');
    const body=document.getElementById('sheetBody');
    function open(tp){
      const tpl=document.getElementById('tpl-'+tp.id);
      body.innerHTML=tpl.innerHTML.replaceAll('__GH__',GH);
      sheet.style.setProperty('--accent',accentOf(tp));
      overlay.hidden=false; sheet.scrollTop=0;
      overlay.querySelector('.sheet-close').focus();
      track('branch_click',{branch:tp.id});
    }
    function close(){ overlay.hidden=true; }
    overlay.addEventListener('click',e=>{ if(e.target.hasAttribute('data-close')) close(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !overlay.hidden) close(); });

    // ---------- Theme ----------
    const html=document.documentElement;
    const saved=localStorage.getItem('theme');
    if(saved) html.setAttribute('data-theme',saved);
    else if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) html.setAttribute('data-theme','dark');
    document.getElementById('themeToggle').addEventListener('click',()=>{
      const next = html.getAttribute('data-theme')==='dark' ? 'light':'dark';
      html.setAttribute('data-theme',next); localStorage.setItem('theme',next);
    });

    // ---------- Analytics ----------
    function track(name, params){ if(typeof gtag==='function'){ gtag('event', name, params||{}); } }
    // track clicks on any external / mailto / download link (socials + panel links)
    document.addEventListener('click', function(e){
      const a = e.target.closest && e.target.closest('a'); if(!a) return;
      const href = a.getAttribute('href') || '';
      if(/^https?:/i.test(href) || /^mailto:/i.test(href) || a.hasAttribute('download')){
        track('link_click', { link_url: href, link_text: (a.getAttribute('aria-label') || a.textContent || '').trim().slice(0,60) });
      }
    });

    // ---------- Build / resize ----------
    function sizePhoto(){
      const d=Math.max(108, Math.min(220, Math.min(stage.clientWidth,stage.clientHeight)*0.23));
      photo.style.width=d+'px'; photo.style.height=d+'px';
    }
    function init(){ sizePhoto(); build(); }
    let rt;
    window.addEventListener('resize',()=>{ clearTimeout(rt); rt=setTimeout(init,180); });
    if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',init);
    else init();
    // fonts can shift label widths / photo size once loaded — rebuild when ready
    if(document.fonts && document.fonts.ready){ document.fonts.ready.then(init); }
  })();
  </script>
